<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#fafafa; padding:40px; }
    form { max-width:320px; margin:auto; background:#fff; padding:20px; border:1px solid #ddd; border-radius:8px; }
    input, button { width:100%; padding:8px; margin-bottom:10px; }
    .err { color:#b00020; margin-bottom:10px; }
  </style>
</head>
<body>
  <h2>Login</h2>
  {% if form.errors %}<div class="err">Invalid username or password.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
</body>
</html>
