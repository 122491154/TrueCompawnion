<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Dog</title>
  <style>
    body { font-family: system-ui, Arial; background:#fafafa; padding:24px; }
    form { max-width:520px; background:#fff; padding:16px; border:1px solid #ddd; border-radius:10px; }
    label { font-weight:600; display:block; margin-top:10px; }
    input, textarea, select { width:100%; padding:8px; margin-top:6px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .actions { margin-top:16px; display:flex; gap:10px; }
    .btn { padding:8px 12px; border:1px solid #ddd; border-radius:8px; background:#fff; }
    img { max-width:240px; height:auto; display:block; margin:8px 0 0; border:1px solid #eee; border-radius:8px; }
    small { color:#666; display:block; margin-top:4px; }
  </style>
</head>
<body>
  <a href="{% url 'home' %}" class="btn">← Back to Admin Home</a>
  <h1>Edit Dog</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Name</label>
    <input type="text" name="name" value="{{ dog.name }}" required>

    <div class="row">
      <div>
        <label>Breed</label>
        <input type="text" name="breed" value="{{ dog.breed }}">
      </div>
      <div>
        <label>Age (years)</label>
        <input type="number" name="age" min="0" step="1" value="{{ dog.age }}">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Microchip Number</label>
        <input type="text" name="microchip_number" maxlength="50" value="{{ dog.microchip_number|default_if_none:'' }}">
        <small>Optional — leave blank if unknown.</small>
      </div>
      <div>
        <label>Location</label>
        <input type="text" name="location" value="{{ dog.location }}">
      </div>
    </div>

    <label>Description</label>
    <textarea name="description" rows="3">{{ dog.description }}</textarea>

    <div class="row">
      <div>
        <label>Activity level</label>
        <select name="activity_level">
          <option value="" {% if not dog.activity_level %}selected{% endif %}>—</option>
          <option value="Low" {% if dog.activity_level == "Low" %}selected{% endif %}>Low</option>
          <option value="Medium" {% if dog.activity_level == "Medium" %}selected{% endif %}>Medium</option>
          <option value="High" {% if dog.activity_level == "High" %}selected{% endif %}>High</option>
        </select>
      </div>
      <div>
        <label>Coat & grooming</label>
        <select name="coat_grooming">
          <option value="" {% if not dog.coat_grooming %}selected{% endif %}>—</option>
          <option value="Low" {% if dog.coat_grooming == "Low" %}selected{% endif %}>Low</option>
          <option value="Medium" {% if dog.coat_grooming == "Medium" %}selected{% endif %}>Medium</option>
          <option value="High" {% if dog.coat_grooming == "High" %}selected{% endif %}>High</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Training difficulty</label>
        <select name="training_difficulty">
          <option value="" {% if not dog.training_difficulty %}selected{% endif %}>—</option>
          <option value="Easy" {% if dog.training_difficulty == "Easy" %}selected{% endif %}>Easy</option>
          <option value="Moderate" {% if dog.training_difficulty == "Moderate" %}selected{% endif %}>Moderate</option>
          <option value="Challenging" {% if dog.training_difficulty == "Challenging" %}selected{% endif %}>Challenging</option>
        </select>
      </div>
      <div>
        <label>Weight (kg)</label>
        <input type="number" name="weight_kg" step="0.1" min="0" value="{{ dog.weight_kg }}">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Height (cm)</label>
        <input type="number" name="height_cm" step="0.1" min="0" value="{{ dog.height_cm }}">
      </div>
      <div style="display:flex; align-items:end; gap:8px;">
        <label style="margin:0;">
          <input type="checkbox" name="adopted" {% if dog.adopted %}checked{% endif %}> Adopted
        </label>
      </div>
    </div>

    <label>Replace photo</label>
    <input type="file" name="image" accept="image/*">
    {% if dog.image %}
      <img src="{{ dog.image.url }}" alt="{{ dog.name }}">
    {% endif %}

    <div class="actions">
      <button type="submit" class="btn">Save Changes</button>
      <a href="{% url 'home' %}" class="btn">Cancel</a>
    </div>
  </form>
</body>
</html>
